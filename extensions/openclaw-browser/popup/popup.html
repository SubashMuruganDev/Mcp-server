<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenClaw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      padding: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo svg { color: #6c63ff; }
    .brand {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 12px;
      color: #7c82a0;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 9px;
      background: #6c63ff;
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #7c74ff; }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linejoin="round"/>
      <path d="M2 17L12 22L22 17" stroke-linejoin="round"/>
      <path d="M2 12L12 17L22 12" stroke-linejoin="round"/>
    </svg>
    <span class="brand">OpenClaw</span>
  </div>
  <p>Open the side panel to browse and chat with OpenClaw on any page.</p>
  <button id="open-panel">Open Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand">OpenClaw</span>
    </div>
    <div class="header-actions">
      <button id="btn-new-chat" class="icon-btn" title="New conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Page context bar ───────────────────────────────────────── -->
  <div id="page-context-bar" class="page-context-bar hidden">
    <div class="page-context-info">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4M12 16h.01"/>
      </svg>
      <span id="page-title-label" class="page-title-label">Reading page…</span>
    </div>
    <button id="btn-clear-context" class="clear-context-btn" title="Stop using page context">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- ── Main views ─────────────────────────────────────────────── -->
  <main id="view-chat" class="view">
    <div id="messages" class="messages" role="log" aria-live="polite"></div>

    <!-- Welcome screen shown when no messages -->
    <div id="welcome" class="welcome">
      <div class="welcome-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="welcome-title">OpenClaw Assistant</h2>
      <p class="welcome-sub">Ask me anything about the current page, or start a conversation.</p>
      <div class="suggestion-chips" id="suggestion-chips">
        <button class="chip" data-text="Summarize this page">Summarize page</button>
        <button class="chip" data-text="What are the main topics on this page?">Main topics</button>
        <button class="chip" data-text="Extract all links from this page">Extract links</button>
        <button class="chip" data-text="What actions can I take on this page?">Page actions</button>
      </div>
    </div>
  </main>

  <!-- Settings view -->
  <div id="view-settings" class="view hidden settings-view">
    <h3 class="settings-title">Settings</h3>

    <label class="field-label">OpenClaw Server URL</label>
    <input id="input-url" class="field-input" type="url" placeholder="http://localhost:18789" />

    <label class="field-label">API Token</label>
    <div class="token-row">
      <input id="input-token" class="field-input" type="password" placeholder="Bearer token" />
      <button id="btn-toggle-token" class="icon-btn small" title="Show/hide token">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="settings-actions">
      <button id="btn-test-connection" class="btn-secondary">Test connection</button>
      <button id="btn-save-settings" class="btn-primary">Save</button>
    </div>
    <p id="connection-status" class="connection-status"></p>

    <button id="btn-back" class="btn-link">← Back to chat</button>
  </div>

  <!-- ── Input area ─────────────────────────────────────────────── -->
  <footer class="input-area" id="input-footer">
    <div class="input-toolbar">
      <button id="btn-read-page" class="tool-btn" title="Read current page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Read page
      </button>
      <button id="btn-screenshot" class="tool-btn" title="Take screenshot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Screenshot
      </button>
    </div>

    <div class="input-row">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Ask about this page…"
        rows="1"
        maxlength="4000"
      ></textarea>
      <button id="btn-send" class="send-btn" title="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div id="char-count" class="char-count">0 / 4000</div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
